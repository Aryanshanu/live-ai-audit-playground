# Fly.io deployment config for the RAI Agent Service.
#
# Region choice is not arbitrary: `ai.gov-prod` (Supabase) already runs
# in AWS ap-south-1 (Mumbai). Fly's `bom` region puts this service in
# the same metro area, minimizing latency on every database write.
# Railway was ruled out for this specific reason — it has no Asia
# presence closer than Singapore. DO NOT change this to a different
# region without re-checking the actual Supabase project region first —
# it's the one thing in this file that's been specifically verified
# against this project's real infrastructure, not a generic default.
#
# `bom` is flagged in Fly's own docs as a higher-demand region where a
# single hardcoded region risks failing to place machines under load —
# `sin` (Singapore) is kept as an explicit fallback, not a hope.

app = "govax-rai-agent"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # 0 = scale to zero when idle (free when unused, cold-start delay on
  # first request after idle). Set to 1 for always-on/no-cold-start, at
  # continuous cost. Left at 0 deliberately: this service has zero real
  # traffic as of this writing — paying 24/7 for an unused service is
  # premature. Revisit once there's real usage to justify it.
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # Bumped from 512mb: Fairlearn's MetricFrame plus the numpy/pandas/
  # sklearn base footprint already uses meaningful memory before
  # processing a single real request. Bump to 2gb before adding SHAP
  # (KernelExplainer in particular is memory-hungry) — not done
  # preemptively since SHAP isn't built yet.
  memory = "1gb"

# Deploy with: flyctl launch --no-deploy   (first time, to review before committing)
# then:        flyctl deploy
# Fallback region if bom is at capacity: flyctl regions add sin
#
# Required secrets (set via `flyctl secrets set KEY=value`, never committed):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY   <- service role, NOT the anon/publishable key.
#                                  This key bypasses RLS entirely — it must
#                                  only ever live in this server-side secret
#                                  store, never in any frontend code or repo file.
